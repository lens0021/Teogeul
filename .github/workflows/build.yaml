name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 #v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          # Calculate 60% of available memory for Gradle
          TOTAL_MEM=$(free -m | awk '/^Mem:/{print $2}')
          GRADLE_MEM=$(( TOTAL_MEM * 60 / 100 ))
          METASPACE_MEM=$(( TOTAL_MEM * 15 / 100 ))
          echo "Total memory: ${TOTAL_MEM}MB, Gradle: ${GRADLE_MEM}MB, Metaspace: ${METASPACE_MEM}MB"
          export GRADLE_OPTS="-Xmx${GRADLE_MEM}m -XX:MaxMetaspaceSize=${METASPACE_MEM}m -Dfile.encoding=UTF-8 -XX:+UseParallelGC"
          ./gradlew assembleDebug --build-cache --configuration-cache --parallel

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teogeul-debug
          path: app/build/outputs/apk/debug/teogeul-debug-*.apk
          retention-days: 30

      - name: Get APK info
        if: github.event_name != 'pull_request'
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/teogeul-debug-*.apk)
          echo "APK Size: $(du -h $APK_FILE | cut -f1)"
          echo "APK Location: $APK_FILE"
