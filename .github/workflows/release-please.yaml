---
name: Release Please
on:
  push:
    branches:
      - main
permissions: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 17
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 #v5.3.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        if: ${{ steps.release.outputs.release_created }}
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        if: ${{ steps.release.outputs.release_created }}
        run: chmod +x gradlew

      - name: Build Release APK
        if: ${{ steps.release.outputs.release_created }}
        run: |
          # Calculate 60% of available memory for Gradle
          TOTAL_MEM=$(free -m | awk '/^Mem:/{print $2}')
          GRADLE_MEM=$(( TOTAL_MEM * 60 / 100 ))
          METASPACE_MEM=$(( TOTAL_MEM * 15 / 100 ))
          echo "Total memory: ${TOTAL_MEM}MB, Gradle: ${GRADLE_MEM}MB, Metaspace: ${METASPACE_MEM}MB"
          export GRADLE_OPTS="-Xmx${GRADLE_MEM}m -XX:MaxMetaspaceSize=${METASPACE_MEM}m -Dfile.encoding=UTF-8 -XX:+UseParallelGC"
          ./gradlew assembleRelease --build-cache --configuration-cache --parallel

      - name: Install Cosign
        if: ${{ steps.release.outputs.release_created }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign APK with Cosign
        if: ${{ steps.release.outputs.release_created }}
        run: |
          APK_FILE="app/build/outputs/apk/release/teogeul-release-${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}.apk"
          cosign sign-blob --yes \
            --bundle "${APK_FILE}.cosign.bundle" \
            "${APK_FILE}"
          echo "✓ APK signed successfully"
          echo "  Signature bundle: ${APK_FILE}.cosign.bundle"

      - name: Upload Release APK
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="app/build/outputs/apk/release/teogeul-release-${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}.apk"
          gh release upload ${{ steps.release.outputs.tag_name }} \
            "${APK_FILE}" \
            "${APK_FILE}.cosign.bundle"
