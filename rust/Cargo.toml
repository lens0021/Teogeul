[package]
name = "teogeul-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "teogeul 의 한글 조합 엔진: geulbus-core 를 감싸는 UniFFI 래퍼"
publish = false

[lib]
name = "teogeul_engine"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# geulbus-core 0.3 출시 전까지 두벌식/D·E·F 지원 브랜치를 핀으로 참조한다.
# https://github.com/chaotic-ground/geulbus/pull/3
geulbus-core = { git = "https://github.com/chaotic-ground/geulbus.git", rev = "3d4db10970edee45c3fcc66c46b84f74e663e6cd" }
hanmo = "0.1"
thiserror = "2"
uniffi = { version = "0.32", features = ["cli"] }

[profile.release]
lto = true
strip = "debuginfo"
